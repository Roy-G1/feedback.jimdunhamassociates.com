<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thank you | Jim Dunham &amp; Associates</title>

  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
  --bg:#ffffff;
  --card:#ffffff;
  --fg:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --accent:#ff0101;    /* logo red */
}
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .shell {
      max-width:760px;
      margin:0 auto;
      padding:40px 16px;
    }
    .logo {
      display:block;
      max-width:260px;
      margin:0 auto 18px;
    }
    .card {
      background:var(--card);
      border-radius:18px;
      padding:28px 22px 32px;
      border:1px solid var(--border);
      box-shadow:0 8px 20px rgba(15,23,42,.06);
      text-align:left;
    }
    h1 {
      margin:0 0 10px;
      font-size:26px;
      color:var(--accent);
    }
    p {
      margin:0 0 14px;
      color:var(--muted);
    }
    a {
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }
    a:hover {
      text-decoration:underline;
    }
  </style>
</head>
<body>
  <main class="shell">
    <img src="jda-logo.png" alt="Jim Dunham &amp; Associates" class="logo" />

    <section class="card">
      <h1>Thank you for your feedback.</h1>
      <p>If you asked for a follow-up, someone from our office will be in touch.</p>
      <p><a href="index.html">Back to start</a></p>
    </section>
  </main>
</body>
</html>
