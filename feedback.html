<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Share private feedback | Jim Dunham &amp; Associates</title>

  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --bg:#ffffff;
      --card:#ffffff;
      --fg:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --accent:#d90429;
      --accent-dark:#9b021d;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .shell {
      max-width:760px;
      margin:0 auto;
      padding:32px 16px 40px;
    }
    .logo {
      display:block;
      max-width:260px;
      margin:0 auto 18px;
    }
    .card {
      background:var(--card);
      border-radius:18px;
      padding:22px 22px 28px;
      border:1px solid var(--border);
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    a {
      color:inherit;
      text-decoration:none;
    }
    .back {
      font-size:14px;
      color:var(--muted);
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-bottom:6px;
    }
    .back:hover { color:var(--fg); }

    h1 {
      margin:8px 0 6px;
      font-size:26px;
      color:var(--accent);
    }
    p {
      margin:0 0 18px;
      color:var(--muted);
    }

    label {
      display:block;
      margin:14px 0 6px;
      font-weight:600;
      font-size:14px;
    }
    input,
    textarea {
      width:100%;
      padding:11px 12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#ffffff;
      color:var(--fg);
      font-size:15px;
      font-family:inherit;
    }
    input::placeholder,
    textarea::placeholder {
      color:#9ca3af;
    }
    textarea {
      min-height:140px;
      resize:vertical;
    }
    .hint {
      font-size:12px;
      color:var(--muted);
      margin-top:3px;
    }

    button {
      margin-top:20px;
      padding:11px 18px;
      border-radius:12px;
      border:1px solid var(--accent-dark);
      background:var(--accent);
      color:#ffffff;
      font-weight:600;
      font-size:15px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    button:hover {
      background:var(--accent-dark);
    }
  </style>
</head>
<body>
  <main class="shell">
    <img src="jda-logo.png" alt="Jim Dunham &amp; Associates" class="logo" />

    <section class="card">
      <a class="back" href="index.html">← Back</a>

      <h1>Tell us what happened</h1>
      <p>We read every message and follow up when requested.</p>

      <!--
        This uses "mailto" so the visitor's email app opens with
        all the fields filled in and addressed to your inbox.
      -->
      <form
        action="mailto:help@storagemgmtsolutions.com?subject=Feedback%20-%20Jim%20Dunham%20%26%20Associates"
        method="POST"
        enctype="text/plain"
      >
        <label for="feedback">Your feedback</label>
        <textarea id="feedback" name="Feedback" required></textarea>

        <label for="contact">Contact (phone or email)</label>
        <input id="contact" name="Contact" required />
        <div class="hint">Required so we can reach you if needed.</div>

        <label for="property">Property</label>
        <input id="property" name="Property" required />

        <label for="name">Name (optional)</label>
        <input id="name" name="Name" />

        <button type="submit">
          Send feedback
        </button>
      </form>
    </section>
  </main>
</body>
</html>
