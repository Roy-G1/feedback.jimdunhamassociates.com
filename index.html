<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>How was your experience? | Jim Dunham &amp; Associates</title>

  <!-- Tab icon / favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --bg:#050505;        /* almost black */
      --card:#151515;      /* dark gray card */
      --fg:#f3f4f6;        /* light gray text */
      --muted:#9ca3af;     /* softer gray */
      --border:#27272a;    /* gray border */
      --accent:#ef4444;    /* red to match logo */
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .shell {
      max-width:760px;
      margin:0 auto;
      padding:40px 16px;
    }
    .logo {
      display:block;
      max-width:260px;
      margin:0 auto 18px;
    }
    .card {
      background:var(--card);
      border-radius:18px;
      padding:26px 22px 30px;
      box-shadow:0 8px 24px rgba(0,0,0,.7);
      border:1px solid var(--border);
    }
    h1 {
      margin:0 0 6px;
      font-size:30px;
      color:var(--accent); /* red heading */
    }
    p {
      margin:0 0 18px;
      color:var(--muted);
    }

    .buttons {
      display:grid;
      gap:16px;
      margin-top:26px;
    }
    .btn {
      display:flex;
      flex-direction:column;   /* icon on top, label under */
      align-items:center;
      justify-content:center;
      padding:16px 16px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      text-decoration:none;
      font-weight:600;
      font-size:15px;
      color:var(--fg);
      background:#111827;
      transition:transform .05s ease-out, box-shadow .05s ease-out;
    }
    .btn:hover {
      transform:translateY(-1px);
      box-shadow:0 6px 14px rgba(0,0,0,.6);
    }
    .btn .icon {
      font-size:26px;
      line-height:1;
      margin-bottom:4px;
    }
    .btn .label {
      text-transform:none;
    }
    /* Green thumbs-up button */
    .btn.good {
      background:#16a34a;
      border-color:#15803d;
      color:#ecfdf3;
    }
    /* Orange thumbs-down button */
    .btn.bad {
      background:#f97316;
      border-color:#ea580c;
      color:#fff7ed;
    }

    .footer {
      margin-top:20px;
      font-size:14px;
      color:var(--muted);
      text-align:left;
    }
    .footer a {
      color:var(--muted);
      text-decoration:none;
    }
    .footer a:hover {
      color:var(--fg);
    }
  </style>
</head>
<body>
  <main class="shell">
    <!-- Page logo -->
    <img src="jda-logo.png" alt="Jim Dunham &amp; Associates" class="logo" />

    <section class="card">
      <h1>How was your experience?</h1>
      <p>Tap an option to continue.</p>

      <div class="buttons">
        <!-- TODO: replace this link with the real Google review URL for Jim Dunham & Associates -->
        <a class="btn good" href="https://g.page/r/YOUR_GOOGLE_REVIEW_LINK/review" target="_blank" rel="noopener">
          <span class="icon">👍</span>
          <span class="label">Satisfied</span>
        </a>

        <a class="btn bad" href="feedback.html">
          <span class="icon">👎</span>
          <span class="label">Needs improvement</span>
        </a>
      </div>

      <div class="footer">
        Jim Dunham &amp; Associates · 519 W 22nd St, Sioux Falls, SD 57105 ·
        <a href="tel:+16052758500">(605) 275-8500</a>
      </div>
    </section>
  </main>
</body>
</html>
