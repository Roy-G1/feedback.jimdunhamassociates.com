<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>How was your experience? | Jim Dunham &amp; Associates</title>
  <style>
    :root { --bg:#f7f7f7; --card:#ffffff; --fg:#111; --muted:#666; --border:#e5e5e5; --btn:#111; --btnfg:#fff; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .shell { max-width:760px; margin:0 auto; padding:40px 16px; }
    .card {
      background:var(--card);
      border-radius:18px;
      padding:26px 22px 30px;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
    }
    h1 { margin:0 0 6px; font-size:30px; }
    p { margin:0 0 18px; color:var(--muted); }
    .buttons { display:grid; gap:12px; margin-top:24px; }
    .btn {
      display:block;
      text-align:center;
      padding:13px 16px;
      border-radius:12px;
      border:1px solid var(--border);
      text-decoration:none;
      font-weight:600;
      color:var(--fg);
      background:#fff;
    }
    .btn.primary {
      background:var(--btn);
      border-color:var(--btn);
      color:var(--btnfg);
    }
    .footer {
      margin-top:18px;
      font-size:14px;
      color:var(--muted);
      text-align:left;
    }
    .footer a { color:inherit; text-decoration:none; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>How was your experience?</h1>
      <p>Tap an option to continue.</p>

      <div class="buttons">
        <!-- TODO: replace this link with the real Google review URL for Jim Dunham & Associates -->
        <a class="btn primary" href="https://g.page/r/YOUR_GOOGLE_REVIEW_LINK/review" target="_blank" rel="noopener">
          Satisfied
        </a>
        <a class="btn" href="feedback.html">Needs improvement</a>
      </div>

      <div class="footer">
        Jim Dunham &amp; Associates · <a href="tel:+16052758500">(605) 275-8500</a>
      </div>
    </section>
  </main>
</body>
</html>
